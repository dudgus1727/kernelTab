[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerneltab"
version = "0.2.0"
description = "CUTLASS GEMM (형상 x config) -> 성능 표 측정 하네스"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# 의존성은 최소로 유지한다. 오케스트레이션은 표준 라이브러리 + ctypes 로
# 충분하고, 무거운 프레임워크(torch/cupy)는 컨테이너 이미지를 몇 GB 불린다.
dependencies = [
    "nvidia-ml-py>=12",   # NVML. 측정 루프 안 클럭/온도 스냅샷용
    # 수정 7: pyarrow/pandas 를 **필수**로 올린다.
    #
    # 계획서에는 "pandas 는 미사용" 이라고 적혀 있었으나 실측과 다르다 —
    # `core/table.py` 의 로더가 `to_pandas()` 를 쓰고 `core/bundle.py` 도
    # 쓴다. 둘 다 **정답 누출을 막는 소비 경로의 핵심**이다.
    #
    # 선택 의존성으로 두면 안 되는 이유가 하나 더 있다: 없으면
    # `test_table.py`/`test_bundle.py` 41개가 통째로 스킵되는데, 그게 바로
    # 누출 방지를 검증하는 모듈이다 (R-1). 필수로 두면 그 상황 자체가
    # 생기지 않는다.
    "pyarrow>=15",
    "pandas>=2",
]

[project.optional-dependencies]
# 아래 둘은 이제 필수 의존성이라 비어 있다. 이름은 호환을 위해 남긴다.
export = []
consumer = []
# 테스트는 GPU 를 전혀 쓰지 않는다 (docs/testing.md)
test = ["pytest>=8"]
# 리포트 그림
plots = ["matplotlib>=3.7"]
dev = ["ruff", "vermin", "uv"]

[tool.setuptools.packages.find]
# `kerneltab.*` 하나만 내보낸다. 예전에는 `core` / `build` / `measure` 가
# 최상위였는데, `build` 는 PyPI 에 실제로 존재하는 패키지(`python -m build`)
# 이고 나머지도 흔한 이름이다. 충돌하면 ImportError 가 아니라 **다른 모듈이
# 조용히 import 된다** — 가장 나쁜 실패 방식이다 (docs/packaging.md).
include = ["kerneltab*"]

[tool.setuptools.package-data]
# measure/*.cu, *.h 는 **런타임에 nvcc 로 컴파일된다.** 패키지 데이터로
# 함께 설치되어야 하고, include 경로는 paths.PKG_ROOT 에서 나온다.
"kerneltab.measure" = ["*.cu", "*.h"]
"kerneltab.build" = ["*.cu"]

# hwspec/ 과 artifacts/ 와 results/ 는 **패키지 밖**이다.
#   hwspec/    데이터 디렉토리 (Python 패키지 아님, __init__.py 없음).
#              KERNELTAB_HWSPEC_DIR 로 위치를 바꿀 수 있다.
#   artifacts/ 커널 .so 7.4 GB. 패키지 안에 있으면 pip 이 가져가려 한다.
#   results/   측정 산출물. 컨테이너 볼륨 마운트 지점.

# ---------------------------------------------------------------------------
# ruff — 무시하는 규칙은 **이유를 적는다** (R-4d)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"        # 컨테이너의 시스템 Python
line-length = 88

[tool.ruff.lint]
# 기본(E4/E7/E9/F)에 **이 프로젝트에서 실제로 문제가 됐던 것**만 더한다.
# 넓게 켜면 경고가 쌓여 아무도 안 보게 된다 — 그게 R-1 이 잡은 병이다.
select = [
    "E4", "E7", "E9", "F",   # ruff 기본
    "I",        # import 정렬
    # B — 흔한 버그. 특히 **테스트가 실제로 검증하는지**를 잡는다.
    #   B015 (결과를 안 쓰는 비교) 가 `assert_no_answers(...) is None` 을
    #        찾아냈다. `assert` 없이 식만 있어 정답 누출 검증이 반쪽만 돌고
    #        있었다 — 예외는 잡히지만 반환값 검사는 죽어 있었다.
    #   B011 (assert False) 는 `python -O` 에서 통째로 사라진다.
    #   R-1 이 "테스트가 도는가" 를 보장했다면 이 둘은 **"도는 테스트가 실제로
    #   검증하는가"** 다. 한 층 더 아래이므로 **끄지 마라.**
    "B",
    "UP",       # 낡은 문법
    "RUF",      # ruff 고유 (RUF100 불필요한 noqa 127건을 걷어냈다)
    "BLE",      # 광범위 except  <- 이 프로젝트가 네 번 밟은 패턴
    "S110", "S112",   # **조용히 pass/continue** <- 진짜 문제
    "PLR0124",  # 자기 자신과 비교 (NaN 관용구)
    "C4", "EXE", "FURB",
]

# ---------------------------------------------------------------------------
# ⚠️ RUF100(불필요한 noqa 제거)은 **규칙 설정이 확정된 뒤에만** 켠다.
#
#    RUF100 은 "현재 켜진 규칙" 기준으로 판정하므로, 꺼져 있는 규칙의 noqa 를
#    전부 지운다. 실제로 `# noqa: E402` 127개가 삭제됐다 (E402 가 select 에
#    없었기 때문이다). `--fix` 후 diff 를 보지 않았으면 조용히 넘어갔을 것이고,
#    나중에 E402 를 켜면 98건이 한꺼번에 튀어나온다.
#
#    **새 규칙을 켜기 전에 그 규칙의 noqa 가 남아 있는지 먼저 확인하라.**
#      git log -S 'noqa: E402' --oneline      # 지워진 적이 있는가
#      ruff check --select E402 --statistics  # 켜면 몇 건인가
#
#    이것은 린터가 자기 설정에 따라 **소스를 파괴하는** 경우다. `--fix` 의
#    diff 를 반드시 볼 것. (docs/decisions.md 15 — 규율은 코드로 강제하라)
# ---------------------------------------------------------------------------
ignore = [
    # 예외를 잡아 **기록하는** 패턴이 많다:
    #     except Exception as e: row["sass_error"] = repr(e)
    # 이건 삼키는 것이 아니라 남기는 것이고(docs/decisions.md 14번의 두 번째
    # 선택지), 외부 도구(nvcc/cuobjdump/NVML)가 무엇을 던질지 다 열거할 수
    # 없다. **아무것도 안 남기는 것(S110/S112)은 전부 없앴다** — 그쪽이
    # 진짜 문제였다.
    "BLE001",
    # subprocess.run(check=) — 반환 코드를 직접 보고 분기하는 곳이 많다.
    # check=True 로 바꾸면 예외로 흐름이 바뀌어 오히려 처리가 흩어진다.
    "PLW1510",
    # 언패킹에서 일부만 쓰는 것은 의도적이다 (`for _, uuid, _ in ...`).
    "RUF059",
    # 문자열을 여러 줄로 나눠 쓴 한국어 메시지가 많다. 붙이면 가독성이 나빠진다.
    "ISC004",
    # 긴 한국어 주석/메시지가 88 자를 넘는 경우가 있다. 내용이 우선이다.
    "E501",
    # 스크립트는 저장소 루트를 sys.path 에 넣은 뒤 import 한다. 구조적이고
    # 의도적이다 (설치 없이 돌아야 한다). 켜면 98건이 전부 이 패턴이다.
    # docs/packaging.md 의 kerneltab.* 이전이 끝나면 다시 볼 것.
    "E402",
    # zip(strict=) — 길이가 다를 수 없는 곳이 대부분이고, 다를 수 있는
    # 곳은 이미 명시적으로 다룬다.
    "B905",
    # 한국어 주석/문자열을 '모호한 유니코드' 로 잡는다. 오탐이다.
    "RUF001", "RUF002", "RUF003",
    # `l` 을 줄(line) 변수로 쓰는 관용이 많다. 문맥이 명확하다.
    "E741",
    # 루프를 리스트 컴프리헨션으로 바꾸라는 제안. 가독성은 취향이고
    # 이 코드는 조건이 붙은 경우가 많아 오히려 읽기 나빠진다.
    "PERF401", "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# 테스트는 assert 를 쓴다 (그게 일이다). 하드코딩된 가짜 값도 정상이다.
"tests/*" = ["S101", "S105", "S106", "PLR2004"]
