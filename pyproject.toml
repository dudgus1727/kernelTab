[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerneltab"
version = "0.1.0"
description = "CUTLASS GEMM (형상 x config) -> 성능 표 측정 하네스"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# 의존성은 최소로 유지한다. 오케스트레이션은 표준 라이브러리 + ctypes 로
# 충분하고, 무거운 프레임워크(torch/cupy)는 컨테이너 이미지를 몇 GB 불린다.
dependencies = [
    "nvidia-ml-py>=12",   # NVML. 측정 루프 안 클럭/온도 스냅샷용
    # 수정 7: pyarrow/pandas 를 **필수**로 올린다.
    #
    # 계획서에는 "pandas 는 미사용" 이라고 적혀 있었으나 실측과 다르다 —
    # `core/table.py` 의 로더가 `to_pandas()` 를 쓰고 `core/bundle.py` 도
    # 쓴다. 둘 다 **정답 누출을 막는 소비 경로의 핵심**이다.
    #
    # 선택 의존성으로 두면 안 되는 이유가 하나 더 있다: 없으면
    # `test_table.py`/`test_bundle.py` 41개가 통째로 스킵되는데, 그게 바로
    # 누출 방지를 검증하는 모듈이다 (R-1). 필수로 두면 그 상황 자체가
    # 생기지 않는다.
    "pyarrow>=15",
    "pandas>=2",
]

[project.optional-dependencies]
# 아래 둘은 이제 필수 의존성이라 비어 있다. 이름은 호환을 위해 남긴다.
export = []
consumer = []
# 테스트는 GPU 를 전혀 쓰지 않는다 (docs/testing.md)
test = ["pytest>=8"]
# 리포트 그림
plots = ["matplotlib>=3.7"]
dev = ["ruff", "vermin", "uv"]

[tool.setuptools]
# ⚠️ 이 상태로 `pip install` 하지 마라. `build` 는 PyPI 에 실제로 존재하는
#    패키지(`python -m build`)이며, 충돌하면 ImportError 가 아니라 **다른
#    모듈이 조용히 import 된다.** `core` / `measure` 도 흔한 이름이라 소비
#    프로젝트와 부딪힌다.
#    docs/packaging.md 의 `kerneltab.*` 네임스페이스 이전을 먼저 적용할 것.
#    (이전은 디렉토리 이동을 포함하므로 P-1(so_path) 수정 이후에 해야 한다)
packages = ["core", "backends", "build", "measure"]
# hwspec/ 은 데이터 디렉토리이며 Python 패키지가 아니다 (__init__.py 없음).

[tool.setuptools.package-data]
"*" = ["*.cu", "*.h"]
